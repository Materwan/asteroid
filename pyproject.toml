[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid"
version = "2.0.0"
description = "A neural-network-driven Asteroids clone"
requires-python = ">=3.11"
dependencies = [
    "pygame",
    "shapely"
]

[project.scripts]
asteroid = "asteroid.main:main"

[tool.setuptools.packages.find]
where = ["src"]